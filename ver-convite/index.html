<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Convite de casamento de Laura e Breno">
<title>Ver convite | Laura & Breno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--wine:#7a1304;--ink:#282526;--muted:#706862}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Montserrat,Arial,sans-serif;text-align:center}main{width:100%}.pdf-section{padding:24px 16px 60px}.pdf-viewer{display:block;width:min(100%,900px);height:min(85vh,1100px);min-height:480px;margin:0 auto;border:0;background:#fff}.pdf-link{display:inline-block;margin:20px auto 0;color:var(--wine);font-size:13px;font-weight:600;text-underline-offset:4px}.rsvp{padding:70px 18px 90px;min-height:50vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}.eyebrow{color:var(--wine);font-size:12px;letter-spacing:.22em;font-weight:600;text-transform:uppercase;margin:0 0 18px}h1{font:500 clamp(44px,7vw,76px)/1.05 "Cormorant Garamond",Georgia,serif;margin:0 0 18px}.lead{font-size:14px;line-height:1.8;max-width:550px;color:var(--muted);margin:0 auto 26px}.button{background:var(--wine);border:1px solid var(--wine);border-radius:999px;color:white;font:700 13px Montserrat,Arial,sans-serif;padding:15px 26px;cursor:pointer}.button:hover{background:#651002}.feedback{color:var(--muted);font-size:13px;min-height:20px;margin-top:18px}@media(max-width:650px){.pdf-section{padding:8px 0 40px}.pdf-viewer{height:72vh;min-height:420px}.rsvp{padding:56px 20px 75px}}
</style>
</head>
<body>
<main>
<section class="pdf-section" aria-label="Convite de Laura e Breno">
<object class="pdf-viewer" data="./../assets/Laura%20%26%20Breno%2019.12.26%20-%20Celebra%C3%A7%C3%A3o.pdf#toolbar=0&navpanes=0" type="application/pdf" aria-label="Visualização do convite em PDF">
<p>Seu navegador não consegue exibir o PDF nesta página. <a href="./../assets/Laura%20%26%20Breno%2019.12.26%20-%20Celebra%C3%A7%C3%A3o.pdf" target="_blank" rel="noopener">Abra o convite aqui.</a></p>
</object>
<a class="pdf-link" href="./../assets/Laura%20%26%20Breno%2019.12.26%20-%20Celebra%C3%A7%C3%A3o.pdf" target="_blank" rel="noopener">Abrir convite em PDF</a>
</section>
<section class="rsvp" id="confirmar">
<button class="button" id="rsvpButton" type="button">Confirmar presença</button>
<p class="feedback" id="rsvpMessage" role="status"></p>
</section>
</main>
<script>document.getElementById("rsvpButton").addEventListener("click",()=>{document.getElementById("rsvpMessage").textContent="A confirmação de presença será disponibilizada aqui."});</script>
</body>
</html>
